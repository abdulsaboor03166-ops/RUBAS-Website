<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RUBAS Perfume - Order</title>

    <link rel="stylesheet" href="../style.css">
    <script src="../script.js"></script>

</head>


<body class="order-page">


    <div class="order-container">


        <!-- HEADER -->

        <div class="order-header">

            <a href="../index.html" class="order-btn">
                ← BACK TO HOME
            </a>

            <h1>
                Place Your <span>Order</span>
            </h1>

            <p>
                Thank you for choosing
                <strong>RUBAS Perfumes</strong>.
                Please fill in your details below.
            </p>

        </div>



        <!-- ORDER CARD -->

        <div class="order-card">


            <!-- PRODUCT -->

            <div class="order-product">

                <img
                    src="../images/product pic 1.png"
                    alt="RUBAS Blue Diamond"
                >

                <h2>
                    RUBAS Blue Diamond
                </h2>

                <p>
                    Fresh • Woody • Aquatic
                </p>

                <strong>
                    Rs. 3,999 PKR
                </strong>

            </div>



            <!-- FORM -->

            <form>


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your full name"
                    required
                >



                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    placeholder="03166787681"
                    required
                >



                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="sabooramir03166@gmail.com"
                >



                <label>
                    Select Perfume
                </label>

                <select>

                    <option>
                        RUBAS Blue Diamond - Rs. 3,999 PKR
                    </option>

                    <option>
                        RUBAS Golden Pearl - Rs. 4,499 PKR
                    </option>

                </select>



                <label>
                    Quantity
                </label>

                <input
                    type="number"
                    value="1"
                    min="1"
                >



                <label>
                    Delivery Address
                </label>

                <textarea
                    rows="5"
                    placeholder="Enter your complete delivery address"
                    required
                ></textarea>



                <label>
                    Payment Method
                </label>


                <div class="payment">

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            checked
                        >
                        Cash on Delivery
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="payment"
                        >
                        Bank Transfer
                    </label>

                </div>



                <button type="submit">
                    PLACE ORDER
                </button>


            </form>

        </div>



        <!-- CONTACT -->

        <div class="contact-intro">

            <h2>
                Need Help?
            </h2>

            <p>
                Contact RUBAS Perfumes for any questions
                about your order.
            </p>

            <p>

                <a href="tel:03166787681">
                    03166787681
                </a>

                &nbsp; | &nbsp;

                <a href="mailto:sabooramir03166@gmail.com">
                    sabooramir03166@gmail.com
                </a>

            </p>

        </div>


    </div>


</body>

</html>
